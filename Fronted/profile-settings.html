<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://images.unsplash.com">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Profile Settings - Kemet Travel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #faf9f6; color: #1f2937; }
    .kemet-title { font-family: "Noto Serif", serif; }
  </style>
    <link rel="stylesheet" href="mobile-fix.css">
</head>
<body>
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="dashboard.html" class="kemet-title text-3xl italic text-[#775a19]">Kemet Travel</a>
      <nav class="flex items-center gap-6 text-sm text-stone-700">
        <a href="explore.html" class="hover:text-[#775a19]">Explore</a>
        <a href="my-trip.html" class="hover:text-[#775a19]">My Trip</a>
        <a href="dashboard.html" class="hover:text-[#775a19]">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10 grid lg:grid-cols-3 gap-6">
    <section class="lg:col-span-2 bg-white rounded-2xl border border-stone-200 p-6">
      <h1 class="kemet-title text-3xl text-[#775a19] mb-4">Profile Settings</h1>
      <p class="text-stone-500 mb-6">Manage your account details and security.</p>

      <form id="profile-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">Full Name</label>
          <input id="profile-name" type="text" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">Email</label>
          <input id="profile-email" type="email" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">Phone Number</label>
          <input id="profile-phone" type="tel" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <button type="submit" class="bg-[#775a19] text-white px-5 py-3 rounded-lg font-semibold hover:bg-[#5f470f] transition-colors">
          Save Profile
        </button>
      </form>
    </section>

    <aside class="bg-white rounded-2xl border border-stone-200 p-6 h-fit">
      <h2 class="kemet-title text-2xl text-[#775a19] mb-2">Loyalty</h2>
      <p class="text-stone-500 mb-4">Points update automatically after each confirmed payment.</p>
      <div class="rounded-xl bg-primary-container/10 border border-primary/30 p-4">
        <p class="text-xs uppercase tracking-wide text-primary mb-1">Current Points</p>
        <p id="profile-loyalty-points" class="text-3xl font-bold text-[#775a19]">0</p>
      </div>
    </aside>

    <section class="lg:col-span-3 bg-white rounded-2xl border border-stone-200 p-6">
      <h2 class="kemet-title text-2xl text-[#775a19] mb-4">Change Password</h2>
      <form id="password-form" class="grid md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">Current Password</label>
          <input id="current-password" type="password" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">New Password</label>
          <input id="new-password" type="password" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <div>
          <label class="block text-sm font-semibold text-stone-700 mb-2">Confirm New Password</label>
          <input id="confirm-password" type="password" class="w-full border border-stone-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#c5a059]">
        </div>
        <div class="md:col-span-3">
          <button type="submit" class="bg-[#775a19] text-white px-5 py-3 rounded-lg font-semibold hover:bg-[#5f470f] transition-colors">
            Update Password
          </button>
        </div>
      </form>
    </section>
  </main>
<div style="width: 100%; margin-top: 50px; overflow: hidden; display: block; clear: both;">
    
    <!-- Silhouette Skyline (Black Pattern) -->
    <div style="width: 100%; height: 90px; 
                background-image: url('https://www.kemet.travel/wp-content/uploads/2023/03/Shutterstock-1399818965-3.png'); 
                background-repeat: repeat-x; 
                background-size: contain; 
                background-position: bottom;
                filter: brightness(0); /* جعل الصورة سوداء بالكامل */
                margin-bottom: -1px;
                padding: 0;
                line-height: 0;">
    </div>

    <!-- Black Ground Bar with Copyright and Payments -->
   <div style="background-color: #1A1A1A; padding: 20px 0; width: 100%;">
        <div style="max-width: 1260px; margin: 0 auto; padding: 0 30px; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif;">
            
            <!-- Centered White Copyright Text -->
            <p style="color: #FFFFFF !important; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 0; font-weight: 500; opacity: 1 !important;">
                KEMET TRAVEL © 2026 ALL RIGHTS RESERVED
            </p>
        </div>
    </div>
</div>

<script src="app.js"></script>
  
</body>
</html>
